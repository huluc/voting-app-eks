name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  sonarqube:
    name: SonarQube scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  build:
    name: Build and push ${{ matrix.service }}
    needs: sonarqube
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    strategy:
      matrix:
        service: [vote, result, worker]
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}  
  deploy:
    name: Deploy to EKS
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Connect kubectl to the cluster
        run: aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME }} --region ${{ vars.AWS_REGION }}

      - name: Point manifests to the new images
        run: |
          for svc in vote result worker; do
            sed -i "s|image: .*/$svc:.*|image: ${{ vars.DOCKERHUB_USERNAME }}/$svc:${{ github.sha }}|" k8s/app/$svc.yaml
          done
          grep -n "image:" k8s/app/*.yaml

      - name: Apply manifests
        run: kubectl apply -f k8s/app/

      - name: Wait for rollout
        run: |
          for d in redis vote result worker; do
            kubectl rollout status deployment/$d -n voting-app --timeout=180s
          done
          kubectl rollout status statefulset/db -n voting-app --timeout=180s