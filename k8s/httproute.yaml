apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: voting-routes
  namespace: voting-app
spec:
  parentRefs:
    - name: voting-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /vote
      backendRefs:
        - name: vote
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /result
      backendRefs:
        - name: result
          port: 80